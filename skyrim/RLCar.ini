[General]
Preset = octane
; The vanilla model drawn for the car (Plugin|FormID without the load-order byte). Hand cart:
CarForm = Skyrim.esm|0x01C0C0
; Turns the model on the car (degrees) and lifts it (Skyrim units) if it faces or sits wrong.
ModelYaw = 0
ModelOffset = 0
DebugLog = 0

[Scale]
; Skyrim metres per Rocket League metre. auto makes the car as long as its model.
WorldScale = auto

[Car]
Gravity = -650
BoostAccelGround = 991.6667
BoostAccelAir = 1058.3334
BoostUsedPerSecond = 33.333332
JumpAccel = 1458.3334
JumpImpulse = 291.66666
WorldFriction = 0.3
WorldRestitution = 0.3
MaxSpeed = 2300
UnlimitedFlips = 0
UnlimitedDoubleJumps = 0
UnlimitedBoost = 1
BoostRecharge = 0
BoostRechargePerSecond = 10
BoostRechargeDelay = 0.25

[Camera]
Preset = Default
FOV = 90
Distance = 270
Height = 100
Angle = -3
Stiffness = 0.5
SwivelSpeed = 2.5
TransitionSpeed = 1.0
InvertSwivelPitch = 0
RearCameraToggle = 0

[Controls]
Throttle = W
Reverse = S
SteerRight = D
SteerLeft = A
PitchUp = S
PitchDown = W
YawRight = D
YawLeft = A
AirRollRight = E
AirRollLeft = Q
AirRoll = LCTRL
Jump = SPACE
Boost = LSHIFT
Powerslide = LCTRL
RearCamera = MMB
ResetCar = R
ExitCar =
BecomeCar = F7
ReloadConfig = F10
InvertPitch = 0

[Gamepad]
Throttle = RT
Reverse = LT
Jump = A
Boost = B
Powerslide = SQUARE
AirRoll = SQUARE
