; RL Car for GTA V: settings. Press F10 in game (ReloadConfig) to apply changes without restarting.
; Every value below is Rocket League's own unless marked otherwise; change any of them freely.
; Values you change away from Rocket League's make the car (or ball) no longer 1:1 with the game.

[General]
; Hitbox preset for new cars: octane, dominus, plank, breakout, hybrid, merc, psyclops
Preset = octane
; blue or orange
Team = blue
; GTA vehicle drawn for the car when no converted Rocket League model is installed (any GTA model name).
FallbackModel = bifta
; Extra height of the drawn model above the physics car, in metres (0 = automatic from the model size).
ModelOffset = 0
; Speed / boost readout while driving.
ShowHud = 1
; Log probe counts and tick timing to RLCar.log once a second.
DebugLog = 0

[Scale]
; GTA metres per metre of Rocket League space (1 uu = 1 cm in Rocket League terms).
; 1.0 = Rocket League's own size (Octane ~1.2 m long). 2.5 = about a GTA car (Octane ~3 m long).
; Physics is identical at any scale; everything just looks bigger and moves proportionally faster.
WorldScale = 2.5

[Car]
; Rocket League's physics settings (the same knobs as its mutators). Units: uu (~1 cm), seconds.
Gravity = -650
BoostAccelGround = 991.6667
BoostAccelAir = 1058.3334
; Boost tank is 100.
BoostUsedPerSecond = 33.333332
JumpAccel = 1458.3334
JumpImpulse = 291.66666
WorldFriction = 0.3
WorldRestitution = 0.3
MaxSpeed = 2300
UnlimitedFlips = 0
UnlimitedDoubleJumps = 0
; Rocket League's "Unlimited" boost mutator (on here by default; the game's default is off).
UnlimitedBoost = 1
BoostRecharge = 0
BoostRechargePerSecond = 10
BoostRechargeDelay = 0.25

[Camera]
; Rocket League's camera settings. Preset: Default, Balanced, Wide, Legacy, Modern, or Custom (uses the values below).
Preset = Default
FOV = 90
Distance = 270
Height = 100
Angle = -3
Stiffness = 0.5
SwivelSpeed = 2.5
TransitionSpeed = 1.0
InvertSwivelPitch = 0
; 1 = each Rear Camera press switches between looking behind and forward.
RearCameraToggle = 0

[Controls]
; Keyboard and mouse. Several keys per action with commas, chords with + (e.g. LCTRL+R).
; Names: A-Z 0-9 F1-F24 SPACE LSHIFT RSHIFT LCTRL RCTRL LALT TAB ENTER UP DOWN LEFT RIGHT LMB RMB MMB MB4 MB5 NUM0-NUM9
Throttle = W
Reverse = S
SteerRight = D
SteerLeft = A
PitchUp = S
PitchDown = W
YawRight = D
YawLeft = A
AirRollRight = E
AirRollLeft = Q
AirRoll = LCTRL
Jump = SPACE
Boost = LSHIFT
Powerslide = LCTRL
RearCamera = MMB
ResetCar = R
; Get out of the car (back to your normal character).
ExitCar = F
; Become the car (or get back in) from anywhere.
BecomeCar = F9
Menu = F7
ReloadConfig = F10
FireWeapon = LMB
NextWeapon = X
InvertPitch = 0

[Gamepad]
; Names: A B X Y (or CROSS CIRCLE SQUARE TRIANGLE) LB RB LT RT LS RS BACK START DUP DDOWN DLEFT DRIGHT.
; Leave empty to unbind. The left stick steers / pitches / yaws, the right stick swivels the camera.
Throttle = RT
Reverse = LT
Jump = A
Boost = B
Powerslide = SQUARE
; Free air roll on Square (X on Xbox), as in Rocket League.
AirRoll = SQUARE
AirRollRight = RB
AirRollLeft = LB
RearCamera = RS
ResetCar = Y
ExitCar = BACK
BecomeCar = LS+RS
FireWeapon = DUP
NextWeapon = DRIGHT
Deadzone = 0.15
SwivelDeadzone = 0.20

[World]
; What the car and ball collide with: 1 = map, 2 = vehicles, 16 = objects (add them up).
ProbeFlags = 19
; Rocket League's arena has curved walls; GTA's buildings meet the ground at a sharp corner, which
; (as in Rocket League) can't be driven up from the ground. WallRamps adds an invisible quarter-pipe
; where the ground meets a steep wall, so buildings can be driven up like the arena's walls.
; Collision shape only: the car's physics is unchanged. 0 = sharp corners (jump onto walls instead).
WallRamps = 1
; Radius of those quarter-pipes in uu (the Bevy demo's arena uses 320).
WallRampRadius = 320
